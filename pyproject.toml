[project]
name = "fpa-driver-model"
version = "0.1.0"
description = "Driver-based FP&A forecast and variance model with optional commentary and analyst review. Synthetic demo data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tishan Perera" }]
keywords = [
  "fp-and-a",
  "forecasting",
  "variance-analysis",
  "financial-modeling",
  "synthetic-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/tishan-perera/fpa-driver-model"
Issues = "https://github.com/tishan-perera/fpa-driver-model/issues"

[project.scripts]
fpa-model = "fpa_driver_model.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpa_driver_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The formatter owns line length. Finance prose keeps the minus and multiplication signs.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["fpa_driver_model"]
